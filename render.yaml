services:
  - type: web
    name: solcare-bot-growatt
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn webhook:app
    healthCheckPath: /health
    envVars:
      - key: AUTHORIZED_CHAT_ID
        sync: false
      - key: GREEN_API_REPLY_CHAT_ID
        sync: false
      - key: GREEN_API_URL
        value: https://api.green-api.com
      - key: GREEN_API_ID
        sync: false
      - key: GREEN_API_TOKEN
        sync: false
      - key: GREEN_API_WEBHOOK_TOKEN
        sync: false
      - key: GROWATT_API_TOKEN
        sync: false
      - key: GROWATT_SERVER_URL
        value: https://openapi.growatt.com/v1/
      - key: GROWATT_PLANT_ID
        sync: false
      - key: GROWATT_DEVICE_SN
        sync: false
      - key: AI_ENABLED
        value: "true"
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_TIMEOUT_SECONDS
        value: "12"
      - key: GROQ_MAX_COMPLETION_TOKENS
        value: "400"
