services:
  - type: web
    name: solcare-bot-growatt
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn webhook:app
    healthCheckPath: /health
    envVars:
      - key: AUTHORIZED_CHAT_ID
        sync: false
      - key: GREEN_API_REPLY_CHAT_ID
        sync: false
      - key: GREEN_API_URL
        value: https://api.green-api.com
      - key: GREEN_API_ID
        sync: false
      - key: GREEN_API_TOKEN
        sync: false
      - key: GREEN_API_WEBHOOK_TOKEN
        sync: false
      - key: GROWATT_API_TOKEN
        sync: false
      - key: GROWATT_SERVER_URL
        value: https://openapi.growatt.com/v1/
      - key: GROWATT_PLANT_ID
        sync: false
      - key: GROWATT_DEVICE_SN
        sync: false
