name: Teste GREEN-API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testar-envio:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Enviar mensagem de teste
        env:
          GREEN_API_URL: ${{ secrets.GREEN_API_URL }}
          GREEN_API_ID: ${{ secrets.GREEN_API_ID }}
          GREEN_API_TOKEN: ${{ secrets.GREEN_API_TOKEN }}
          GREEN_API_CHAT_ID: ${{ secrets.GREEN_API_CHAT_ID }}
        run: |
          python - <<'PY'
          from config import env, required_env
          from whatsapp import send_green_api

          send_green_api(
              api_url=env("GREEN_API_URL"),
              id_instance=required_env("GREEN_API_ID"),
              api_token=required_env("GREEN_API_TOKEN"),
              chat_id=required_env("GREEN_API_CHAT_ID"),
              message="Teste SolCare - integração GREEN-API funcionando.",
          )
          PY
